<!DOCTYPE html>
<html>
<head>
  <title>Manager Access</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="split-container">

    <!-- LEFT SIDE: REGISTER -->
    <div class="left">
      <h2>Register as Manager</h2>

      <label>Name</label>
      <input id="name" type="text">

      <label>SSN</label>
      <input id="ssn" type="text">

      <label>Email</label>
      <input id="email" type="email">

      <button onclick="registerManager()">Register</button>
    </div>

    <!-- RIGHT SIDE: LOGIN -->
    <div class="right">
      <h2>Login as Manager</h2>

      <label>SSN</label>
      <input id="loginSsn" type="text">

      <button onclick="loginManager()">Login</button>
    </div>

  </div>
  

  <script src="script.js"></script>
  
</body>
</html>
